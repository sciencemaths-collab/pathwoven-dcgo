<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
  <title id="title">PathWoven-DCGO architecture and application domains</title>
  <desc id="desc">Professional academic architecture figure showing the PathWoven-DCGO optimization workflow, PSO local search, simulated annealing global refinement, validation, and application domains.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:36px;font-weight:700;fill:#0f172a}
      .subtitle{font-family:Arial,sans-serif;font-size:18px;fill:#475569}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .section{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#0f172a}
      .text{font-family:Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Arial,sans-serif;font-size:13px;fill:#64748b}
      .mono{font-family:Courier New,monospace;font-size:13px;fill:#1e293b}
      .num{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#1d4ed8}
      .apph{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .appt{font-family:Arial,sans-serif;font-size:13px;fill:#475569}
    </style>
  </defs>
  <rect width="1500" height="930" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">PathWoven-DCGO</text>
  <text x="750" y="82" text-anchor="middle" class="subtitle">Geometry-guided decomposition, PSO flock search, annealed refinement, and DCGO coordination for hard nonconvex optimization</text>

  <rect x="50" y="120" width="210" height="155" rx="18" class="box"/>
  <circle cx="80" cy="150" r="16" fill="#dbeafe"/><text x="80" y="156" text-anchor="middle" class="num">1</text>
  <text x="108" y="154" class="section">Problem landscape</text>
  <path d="M80 245 C105 205,135 230,162 188 C187 150,220 240,238 198" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="80" y="262" class="text">Input objective f(x), bounds,</text>
  <text x="80" y="280" class="text">and evaluation budget.</text>

  <line x1="260" y1="198" x2="320" y2="198" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="320" y="120" width="220" height="155" rx="18" class="box"/>
  <circle cx="350" cy="150" r="16" fill="#dbeafe"/><text x="350" y="156" text-anchor="middle" class="num">2</text>
  <text x="378" y="154" class="section">Circular mapping</text>
  <circle cx="430" cy="208" r="48" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="430" y1="208" x2="476" y2="208" stroke="#0f766e" stroke-width="3"/>
  <circle cx="430" cy="208" r="4" fill="#111827"/>
  <text x="482" y="212" class="mono">r</text>
  <text x="375" y="262" class="mono">z = 2*(x-l)/(u-l) - 1</text>

  <line x1="540" y1="198" x2="600" y2="198" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="600" y="120" width="230" height="155" rx="18" class="box"/>
  <circle cx="630" cy="150" r="16" fill="#dbeafe"/><text x="630" y="156" text-anchor="middle" class="num">3</text>
  <text x="658" y="154" class="section">Sector decomposition</text>
  <circle cx="715" cy="208" r="50" fill="none" stroke="#2563eb" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="715" y1="208" x2="765" y2="208"/><line x1="715" y1="208" x2="750" y2="173"/><line x1="715" y1="208" x2="715" y2="158"/>
    <line x1="715" y1="208" x2="680" y2="173"/><line x1="715" y1="208" x2="665" y2="208"/><line x1="715" y1="208" x2="680" y2="243"/>
    <line x1="715" y1="208" x2="715" y2="258"/><line x1="715" y1="208" x2="750" y2="243"/>
  </g>
  <path d="M715 208 L765 208 A50 50 0 0 0 750 173 Z" fill="#bfdbfe"/>
  <text x="650" y="262" class="mono">theta = atan2(z2, z1)</text>

  <line x1="830" y1="198" x2="890" y2="198" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="890" y="120" width="255" height="155" rx="18" class="box"/>
  <circle cx="920" cy="150" r="16" fill="#dbeafe"/><text x="920" y="156" text-anchor="middle" class="num">4</text>
  <text x="948" y="154" class="section">PathWoven windows</text>
  <rect x="955" y="192" width="125" height="40" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
  <line x1="980" y1="192" x2="980" y2="232" stroke="#94a3b8"/><line x1="1005" y1="192" x2="1005" y2="232" stroke="#94a3b8"/><line x1="1030" y1="192" x2="1030" y2="232" stroke="#94a3b8"/><line x1="1055" y1="192" x2="1055" y2="232" stroke="#94a3b8"/>
  <text x="950" y="260" class="text">Unroll sectors into disciplined</text>
  <text x="950" y="278" class="text">local search windows.</text>

  <line x1="1145" y1="198" x2="1205" y2="198" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="1205" y="120" width="245" height="155" rx="18" class="box"/>
  <circle cx="1235" cy="150" r="16" fill="#dbeafe"/><text x="1235" y="156" text-anchor="middle" class="num">5</text>
  <text x="1263" y="154" class="section">Output and evidence</text>
  <circle cx="1328" cy="206" r="40" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="1328" cy="206" r="21" fill="none" stroke="#0f766e" stroke-width="4"/>
  <circle cx="1328" cy="206" r="6" fill="#111827"/>
  <text x="1248" y="260" class="text">Best solution, convergence</text>
  <text x="1248" y="278" class="text">trace, and benchmark evidence.</text>

  <rect x="70" y="335" width="650" height="290" rx="22" class="box"/>
  <text x="100" y="372" class="section">Local search: PSO inside each slice</text>
  <text x="100" y="396" class="small">Each sector receives a coordinated sub-swarm. Circles are particles; triangles indicate directional movement.</text>
  <rect x="105" y="430" width="165" height="115" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="295" y="430" width="165" height="115" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="485" y="430" width="165" height="115" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <g fill="#1d4ed8">
    <circle cx="140" cy="515" r="6"/><circle cx="180" cy="486" r="6"/><circle cx="225" cy="462" r="6"/>
    <circle cx="335" cy="518" r="6"/><circle cx="382" cy="492" r="6"/><circle cx="425" cy="462" r="6"/>
    <circle cx="525" cy="518" r="6"/><circle cx="572" cy="492" r="6"/><circle cx="615" cy="462" r="6"/>
  </g>
  <g fill="#0f766e">
    <path d="M154 450 l16 8 l-16 8 z"/><path d="M348 450 l16 8 l-16 8 z"/><path d="M538 450 l16 8 l-16 8 z"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <path d="M140 515 C155 505,185 485,225 462"/>
    <path d="M335 518 C350 505,384 485,425 462"/>
    <path d="M525 518 C540 505,574 485,615 462"/>
  </g>
  <text x="110" y="578" class="mono">v_i(t+1) = w*v_i + c1*r1*(p_i-x_i) + c2*r2*(g_k-x_i) + c3*r3*(g-x_i)</text>
  <text x="110" y="600" class="mono">x_i(t+1) = x_i(t) + v_i(t+1)</text>

  <rect x="780" y="335" width="650" height="290" rx="22" class="box"/>
  <text x="810" y="372" class="section">Global refinement: simulated annealing + DCGO coordination</text>
  <text x="810" y="396" class="small">The controller enables early exploration, late-stage discipline, cross-slice information sharing, and best-path retention.</text>
  <line x1="860" y1="545" x2="1160" y2="545" stroke="#334155" stroke-width="1.7"/>
  <line x1="860" y1="430" x2="860" y2="545" stroke="#334155" stroke-width="1.7"/>
  <path d="M860 445 C930 455,980 485,1035 505 C1085 522,1120 533,1160 540" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="1172" y="548" class="small">iteration</text>
  <text x="845" y="422" class="small">T</text>
  <text x="810" y="580" class="mono">P_accept = exp(-delta_E / T)</text>
  <text x="810" y="602" class="mono">T_next = alpha * T</text>
  <rect x="1185" y="438" width="200" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1200" y="464" class="apph">DCGO coordination</text>
  <text x="1200" y="488" class="appt">• sector scoring</text>
  <text x="1200" y="506" class="appt">• cross-slice sharing</text>
  <text x="1200" y="524" class="appt">• adaptive updates</text>

  <line x1="720" y1="480" x2="780" y2="480" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1105" y1="335" x2="1105" y2="275" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="395" y1="335" x2="395" y2="275" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="55" y="675" width="1390" height="190" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="85" y="715" class="section">Representative application domains</text>
  <rect x="85" y="735" width="205" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="100" y="760" class="apph">Robotics &amp; motion planning</text><text x="100" y="782" class="appt">Collision-free transitions,</text><text x="100" y="799" class="appt">multi-stage path refinement.</text>
  <rect x="315" y="735" width="205" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="330" y="760" class="apph">Logistics &amp; scheduling</text><text x="330" y="782" class="appt">Route design, dispatch,</text><text x="330" y="799" class="appt">resource allocation.</text>
  <rect x="545" y="735" width="205" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="560" y="760" class="apph">Manufacturing &amp; assembly</text><text x="560" y="782" class="appt">Sequence optimization,</text><text x="560" y="799" class="appt">tool-path coordination.</text>
  <rect x="775" y="735" width="205" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="790" y="760" class="apph">Network reconfiguration</text><text x="790" y="782" class="appt">Topology adaptation and</text><text x="790" y="799" class="appt">fault-aware state changes.</text>
  <rect x="1005" y="735" width="205" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1020" y="760" class="apph">Legal / workflow design</text><text x="1020" y="782" class="appt">Constraint-aware process</text><text x="1020" y="799" class="appt">optimization and sequencing.</text>
  <rect x="1235" y="735" width="180" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1250" y="760" class="apph">Scientific transitions</text><text x="1250" y="782" class="appt">Pathway search in rugged</text><text x="1250" y="799" class="appt">energy or objective spaces.</text>
</svg>
