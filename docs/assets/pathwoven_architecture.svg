<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">PathWoven-DCGO Architecture</title><desc id="d">Clean architecture schematic for PathWoven-DCGO without text overflow.</desc><rect width="1600" height="900" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1e293b"/></marker><style>.h{font:700 38px Arial;fill:#0f172a}.s{font:19px Arial;fill:#475569}.b{fill:#f8fafc;stroke:#93c5fd;stroke-width:2}.t{font:700 20px Arial;fill:#0f172a}.p{font:15px Arial;fill:#334155}.m{font:14px Courier New;fill:#0f172a}.n{font:700 18px Arial;fill:#1d4ed8}.c{fill:#fff;stroke:#93c5fd;stroke-width:2}.ic{stroke:#1d4ed8;stroke-width:4;fill:none}.teal{stroke:#0f766e;stroke-width:3}</style></defs><text x="800" y="50" text-anchor="middle" class="h">PathWoven-DCGO</text><text x="800" y="84" text-anchor="middle" class="s">Geometry-guided decomposition, PSO flock search, annealed refinement, and DCGO coordination</text><g id="top"><rect x="50" y="130" width="250" height="160" rx="18" class="b"/><circle cx="83" cy="162" r="17" fill="#dbeafe"/><text x="83" y="168" text-anchor="middle" class="n">1</text><text x="115" y="166" class="t">Problem landscape</text><path d="M85 245 C120 210 150 235 178 185 C205 140 235 230 265 195" class="ic"/><text x="175" y="268" text-anchor="middle" class="p">Objective, bounds, budget</text><rect x="365" y="130" width="250" height="160" rx="18" class="b"/><circle cx="398" cy="162" r="17" fill="#dbeafe"/><text x="398" y="168" text-anchor="middle" class="n">2</text><text x="430" y="166" class="t">Circular mapping</text><circle cx="490" cy="218" r="45" class="ic"/><line x1="490" y1="218" x2="535" y2="218" class="teal"/><circle cx="490" cy="218" r="4" fill="#0f172a"/><text x="490" y="273" text-anchor="middle" class="p">Normalize into radial frame</text><rect x="680" y="130" width="250" height="160" rx="18" class="b"/><circle cx="713" cy="162" r="17" fill="#dbeafe"/><text x="713" y="168" text-anchor="middle" class="n">3</text><text x="745" y="166" class="t">Sector decomposition</text><circle cx="805" cy="218" r="45" class="ic"/><path d="M805 218 L850 218 A45 45 0 0 0 837 186 Z" fill="#bfdbfe"/><g stroke="#94a3b8"><line x1="805" y1="173" x2="805" y2="263"/><line x1="760" y1="218" x2="850" y2="218"/><line x1="773" y1="186" x2="837" y2="250"/><line x1="773" y1="250" x2="837" y2="186"/></g><text x="805" y="273" text-anchor="middle" class="p">Angular local sectors</text><rect x="995" y="130" width="250" height="160" rx="18" class="b"/><circle cx="1028" cy="162" r="17" fill="#dbeafe"/><text x="1028" y="168" text-anchor="middle" class="n">4</text><text x="1060" y="166" class="t">PathWoven windows</text><rect x="1070" y="205" width="120" height="42" rx="9" fill="#e0f2fe" stroke="#38bdf8"/><line x1="1094" y1="205" x2="1094" y2="247" stroke="#94a3b8"/><line x1="1118" y1="205" x2="1118" y2="247" stroke="#94a3b8"/><line x1="1142" y1="205" x2="1142" y2="247" stroke="#94a3b8"/><line x1="1166" y1="205" x2="1166" y2="247" stroke="#94a3b8"/><text x="1120" y="273" text-anchor="middle" class="p">Unrolled search windows</text><rect x="1310" y="130" width="250" height="160" rx="18" class="b"/><circle cx="1343" cy="162" r="17" fill="#dbeafe"/><text x="1343" y="168" text-anchor="middle" class="n">5</text><text x="1375" y="166" class="t">Output evidence</text><circle cx="1435" cy="220" r="42" class="ic"/><circle cx="1435" cy="220" r="24" class="teal" fill="none"/><circle cx="1435" cy="220" r="6" fill="#0f172a"/><text x="1435" y="273" text-anchor="middle" class="p">Best x*, traces, evidence</text><g stroke="#1e293b" stroke-width="3" marker-end="url(#a)"><line x1="300" y1="210" x2="350" y2="210"/><line x1="615" y1="210" x2="665" y2="210"/><line x1="930" y1="210" x2="980" y2="210"/><line x1="1245" y1="210" x2="1295" y2="210"/></g></g><g id="middle"><rect x="60" y="335" width="720" height="290" rx="24" class="b"/><text x="95" y="380" class="t">Local search: PSO inside each slice</text><text x="95" y="410" class="p">Coordinated sub-swarms search each sector window.</text><g><rect x="115" y="450" width="165" height="90" rx="12" class="c"/><rect x="325" y="450" width="165" height="90" rx="12" class="c"/><rect x="535" y="450" width="165" height="90" rx="12" class="c"/><g fill="#1d4ed8"><circle cx="145" cy="512" r="7"/><circle cx="195" cy="485" r="7"/><circle cx="250" cy="462" r="7"/><circle cx="355" cy="512" r="7"/><circle cx="405" cy="485" r="7"/><circle cx="460" cy="462" r="7"/><circle cx="565" cy="512" r="7"/><circle cx="615" cy="485" r="7"/><circle cx="670" cy="462" r="7"/></g><g fill="#0f766e"><path d="M160 462 l18 9 l-18 9z"/><path d="M370 462 l18 9 l-18 9z"/><path d="M580 462 l18 9 l-18 9z"/></g><g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"><line x1="145" y1="512" x2="250" y2="462"/><line x1="355" y1="512" x2="460" y2="462"/><line x1="565" y1="512" x2="670" y2="462"/></g></g><text x="95" y="578" class="m">v_i(t+1)=w*v_i+c1*r1*(p_i-x_i)+c2*r2*(g_k-x_i)+c3*r3*(g-x_i)</text><text x="95" y="602" class="m">x_i(t+1)=x_i(t)+v_i(t+1)</text><rect x="840" y="335" width="700" height="290" rx="24" class="b"/><text x="875" y="380" class="t">Global refinement: simulated annealing + DCGO coordination</text><text x="875" y="410" class="p">Exploration cools into disciplined cross-slice coordination.</text><line x1="915" y1="560" x2="1215" y2="560" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/><line x1="915" y1="560" x2="915" y2="460" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/><path d="M930 470 C1000 475 1060 520 1125 545 C1160 555 1190 558 1210 558" class="ic"/><text x="900" y="458" class="t">T</text><text x="1225" y="565" class="p">iteration</text><text x="875" y="590" class="m">P_accept=exp(-delta_E/T)</text><text x="875" y="612" class="m">T_next=alpha*T</text><rect x="1280" y="445" width="220" height="115" rx="14" class="c"/><text x="1300" y="480" class="t">DCGO coordination</text><text x="1300" y="512" class="p">• sector scoring</text><text x="1300" y="535" class="p">• cross-slice sharing</text><text x="1300" y="558" class="p">• adaptive updates</text><line x1="780" y1="480" x2="825" y2="480" stroke="#1e293b" stroke-width="3" marker-end="url(#a)"/></g><g id="apps"><rect x="60" y="665" width="1480" height="190" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="95" y="710" class="t">Representative application domains</text><g class="p"><rect x="95" y="735" width="220" height="95" rx="12" class="c"/><text x="112" y="765" class="t">Robotics</text><text x="112" y="795">Motion planning and paths.</text><rect x="335" y="735" width="220" height="95" rx="12" class="c"/><text x="352" y="765" class="t">Logistics</text><text x="352" y="795">Scheduling and dispatch.</text><rect x="575" y="735" width="220" height="95" rx="12" class="c"/><text x="592" y="765" class="t">Manufacturing</text><text x="592" y="795">Assembly and tool paths.</text><rect x="815" y="735" width="220" height="95" rx="12" class="c"/><text x="832" y="765" class="t">Networks</text><text x="832" y="795">Fault-aware reconfiguration.</text><rect x="1055" y="735" width="220" height="95" rx="12" class="c"/><text x="1072" y="765" class="t">Workflows</text><text x="1072" y="795">Legal and compliance logic.</text><rect x="1295" y="735" width="220" height="95" rx="12" class="c"/><text x="1312" y="765" class="t">Science</text><text x="1312" y="795">Transition-path search.</text></g></g></svg>