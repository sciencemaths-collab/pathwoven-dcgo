<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PathWoven-DCGO architecture</title>
  <desc id="desc">A professional optimization architecture diagram showing geometric slicing, PSO particles, simulated annealing refinement, and DCGO coordination.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <style>.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.title{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#475569}.tiny{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#64748b}.eq{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#1e293b}.num{fill:#1d4ed8;font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800}</style>
  </defs>
  <text x="700" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">PathWoven-DCGO Architecture</text>
  <text x="700" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Geometric decomposition + PSO flock search + annealed global refinement</text>
  <rect x="50" y="135" width="205" height="160" rx="18" class="box"/><circle cx="78" cy="162" r="18" fill="#dbeafe"/><text x="78" y="168" text-anchor="middle" class="num">1</text><text x="105" y="166" class="title">Problem landscape</text><path d="M82 250 C110 205,135 230,160 185 C190 135,215 250,238 190" fill="none" stroke="#1d4ed8" stroke-width="4"/><text x="80" y="275" class="small">rugged nonconvex objective</text>
  <line x1="255" y1="215" x2="310" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="135" width="205" height="160" rx="18" class="box"/><circle cx="338" cy="162" r="18" fill="#dbeafe"/><text x="338" y="168" text-anchor="middle" class="num">2</text><text x="365" y="166" class="title">Circular map</text><circle cx="412" cy="220" r="50" fill="none" stroke="#1d4ed8" stroke-width="3"/><line x1="412" y1="220" x2="462" y2="220" stroke="#0f766e" stroke-width="3"/><circle cx="412" cy="220" r="4" fill="#0f172a"/><text x="428" y="212" class="eq">r</text><text x="350" y="282" class="eq">C=2πr, A=πr²</text>
  <line x1="515" y1="215" x2="570" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="135" width="205" height="160" rx="18" class="box"/><circle cx="598" cy="162" r="18" fill="#dbeafe"/><text x="598" y="168" text-anchor="middle" class="num">3</text><text x="625" y="166" class="title">Pizza sectors</text><circle cx="672" cy="220" r="52" fill="none" stroke="#1d4ed8" stroke-width="3"/><g stroke="#94a3b8" stroke-width="1.5"><line x1="672" y1="220" x2="724" y2="220"/><line x1="672" y1="220" x2="709" y2="183"/><line x1="672" y1="220" x2="672" y2="168"/><line x1="672" y1="220" x2="635" y2="183"/><line x1="672" y1="220" x2="620" y2="220"/><line x1="672" y1="220" x2="635" y2="257"/><line x1="672" y1="220" x2="672" y2="272"/><line x1="672" y1="220" x2="709" y2="257"/></g><path d="M672 220 L724 220 A52 52 0 0 0 709 183 Z" fill="#bfdbfe"/><text x="610" y="282" class="small">sectors theta1 ... thetaK</text>
  <line x1="775" y1="215" x2="830" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830" y="135" width="235" height="160" rx="18" class="box"/><circle cx="858" cy="162" r="18" fill="#dbeafe"/><text x="858" y="168" text-anchor="middle" class="num">4</text><text x="885" y="166" class="title">PathWoven windows</text><g transform="translate(865,207)"><rect x="0" y="0" width="165" height="38" rx="8" fill="#e0f2fe" stroke="#38bdf8"/><line x1="28" y1="0" x2="28" y2="38" stroke="#94a3b8"/><line x1="56" y1="0" x2="56" y2="38" stroke="#94a3b8"/><line x1="84" y1="0" x2="84" y2="38" stroke="#94a3b8"/><line x1="112" y1="0" x2="112" y2="38" stroke="#94a3b8"/><line x1="140" y1="0" x2="140" y2="38" stroke="#94a3b8"/></g><text x="870" y="275" class="eq">strip length ≈ πr, width ≈ r</text>
  <line x1="1065" y1="215" x2="1120" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1120" y="135" width="230" height="160" rx="18" class="box"/><circle cx="1148" cy="162" r="18" fill="#dbeafe"/><text x="1148" y="168" text-anchor="middle" class="num">5</text><text x="1175" y="166" class="title">DCGO output</text><circle cx="1235" cy="220" r="44" fill="none" stroke="#1d4ed8" stroke-width="4"/><circle cx="1235" cy="220" r="22" fill="none" stroke="#0f766e" stroke-width="4"/><circle cx="1235" cy="220" r="6" fill="#0f172a"/><text x="1170" y="282" class="small">best solution x*, trace, certificate</text>
  <rect x="110" y="365" width="555" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="145" y="405" class="title">Local PSO search inside each PathWoven slice</text><text x="145" y="430" class="small">Circles are candidate particles; triangles are directional swarm vectors.</text>
  <g transform="translate(145,462)"><rect x="0" y="0" width="130" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="150" y="0" width="130" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="300" y="0" width="130" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1"/><g fill="#1d4ed8"><circle cx="35" cy="65" r="6"/><circle cx="70" cy="44" r="6"/><circle cx="105" cy="32" r="6"/><circle cx="190" cy="70" r="6"/><circle cx="230" cy="50" r="6"/><circle cx="260" cy="28" r="6"/><circle cx="335" cy="70" r="6"/><circle cx="370" cy="48" r="6"/><circle cx="407" cy="25" r="6"/></g><g fill="#0f766e"><path d="M50 25 l16 8 l-16 8 z"/><path d="M205 30 l16 8 l-16 8 z"/><path d="M355 25 l16 8 l-16 8 z"/></g><g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"><path d="M35 65 C55 55,78 44,105 32" fill="none"/><path d="M190 70 C212 61,235 44,260 28" fill="none"/><path d="M335 70 C360 57,383 39,407 25" fill="none"/></g></g><text x="150" y="585" class="eq">v_i(t+1)=w v_i + c1 r1(p_i-x_i) + c2 r2(g_k-x_i) + c3 r3(g-x_i)</text>
  <rect x="735" y="365" width="555" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="770" y="405" class="title">Global simulated-annealing refinement</text><text x="770" y="430" class="small">Early heat permits exploratory weaving; cooling concentrates search.</text><g transform="translate(785,470)"><line x1="0" y1="95" x2="230" y2="95" stroke="#334155"/><line x1="0" y1="0" x2="0" y2="95" stroke="#334155"/><path d="M0 15 C45 28,78 55,116 68 C155 80,190 87,230 92" fill="none" stroke="#1d4ed8" stroke-width="5"/><text x="238" y="96" class="tiny">iteration</text><text x="-8" y="-8" class="tiny">T</text></g><text x="1045" y="492" class="eq">P = exp(-dE/T)</text><text x="1045" y="520" class="eq">T next = alpha T</text><text x="770" y="585" class="small">Controller updates sector boundaries and retains the best path.</text>
  <line x1="665" y1="488" x2="735" y2="488" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><line x1="1010" y1="365" x2="1010" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><line x1="386" y1="365" x2="386" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="95" y="665" width="1210" height="50" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="700" y="696" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1e3a8a">Core loop: slice the search geometry, coordinate PSO particles in local windows, then anneal sector structure until convergence.</text>
</svg>