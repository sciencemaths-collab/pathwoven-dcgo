<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">PathWoven-DCGO Benchmark Summary</title><desc id="d">Clean benchmark figure for PathWoven-DCGO without text overflow.</desc><rect width="1600" height="900" fill="#fff"/><defs><style>.h{font:700 38px Arial;fill:#0f172a}.s{font:19px Arial;fill:#475569}.b{fill:#fff;stroke:#bfdbfe;stroke-width:2}.t{font:700 23px Arial;fill:#0f172a}.p{font:16px Arial;fill:#334155}.sm{font:14px Arial;fill:#475569}.m{font:17px Arial;fill:#0f172a}.grid{stroke:#e2e8f0;stroke-dasharray:6 6}.axis{stroke:#0f172a;stroke-width:2}.blue{stroke:#1d4ed8;stroke-width:4;fill:none}.teal{stroke:#0f766e;stroke-width:4;fill:none}.gray{stroke:#94a3b8;stroke-width:4;stroke-dasharray:10 8;fill:none}</style></defs><text x="800" y="52" text-anchor="middle" class="h">PathWoven-DCGO Benchmark Summary</text><text x="800" y="88" text-anchor="middle" class="s">Michalewicz smoke benchmark. Score = -best objective, so larger score indicates a lower objective value.</text><rect x="50" y="135" width="470" height="570" rx="22" class="b"/><text x="90" y="185" class="t">A. Final best-objective score</text><text x="90" y="220" class="p">3-run smoke benchmark; higher is better.</text><g id="bars"><line x1="120" y1="585" x2="485" y2="585" class="axis"/><line x1="120" y1="280" x2="120" y2="585" class="axis"/><g class="grid"><line x1="120" y1="585" x2="485" y2="585"/><line x1="120" y1="524" x2="485" y2="524"/><line x1="120" y1="463" x2="485" y2="463"/><line x1="120" y1="402" x2="485" y2="402"/><line x1="120" y1="341" x2="485" y2="341"/><line x1="120" y1="280" x2="485" y2="280"/></g><g class="sm"><text x="90" y="590">0</text><text x="90" y="529">1</text><text x="90" y="468">2</text><text x="90" y="407">3</text><text x="90" y="346">4</text><text x="90" y="285">5</text></g><rect x="170" y="487" width="68" height="98" rx="8" fill="#94a3b8"/><rect x="280" y="347" width="68" height="238" rx="8" fill=