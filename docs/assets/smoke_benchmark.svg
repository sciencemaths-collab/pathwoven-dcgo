" fill="#fff" stroke="#93c5fd"/><rect x="1170" y="260" width="335" height="58" fill="#eff6ff" stroke="#93c5fd"/><line x1="1368" y1="260" x2="1368" y2="510" stroke="#93c5fd"/><text x="1190" y="296" class="t">Method</text><text x="1410" y="296" class="t">Score</text><line x1="1170" y1="318" x2="1505" y2="318" stroke="#cbd5e1"/><line x1="1170" y1="382" x2="1505" y2="382" stroke="#cbd5e1"/><line x1="1170" y1="446" x2="1505" y2="446" stroke="#cbd5e1"/><rect x="1170" y="446" width="335" height="64" fill="#eff6ff"/><text x="1190" y="358" class="m">SA</text><text x="1410" y="358" class="m">1.606</text><text x="1190" y="422" class="m">PSO</text><text x="1410" y="422" class="m">3.896</text><text x="1190" y="472" class="t">PathWoven</text><text x="1190" y="496" class="t">Inside DCGO</text><text x="1410" y="486" class="t">4.048</text></g><text x="1170" y="555" class="t">Preliminary interpretation:</text><text x="1170" y="590" class="p">PathWoven Inside DCGO achieved</text><text x="1170" y="615" class="p">the strongest score in this smoke run.</text><text x="1170" y="640" class="p">Full claims require matched budgets,</text><text x="1170" y="665" class="p">repeated seeds, and formal tests.</text><rect x="50" y="755" width="1500" height="95" rx="20" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/><text x="90" y="802" class="t">Recommended academic evidence stack</text><text x="90" y="835" class="p">Matched evaluation budgets • repeated seeds • mean ± standard deviation • convergence traces • ANOVA / post-hoc tests • dimension-scaled benchmark matrix</text></svg>